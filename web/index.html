<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uNyan</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #10101a;
  }
  body {
    height: 100vh;
    height: 100dvh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    background: #4444ff;
  }
  #status {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 12px;
    padding: 8px 12px;
    background: #10101acc;
    pointer-events: none;
    font-family: system-ui,Segoe UI,Arial,sans-serif;
    font-size: 14px;
    color: #9db2ff;
    user-select: none;
  }
</style>
</head>
<body>
  <canvas id="uNyanScreen" width="1152" height="720"></canvas>
  <div id="status" role="status">uNyan (WebAssembly): move the mouse to fly, press Z to drop
    health, press Esc to quit. The music starts after the first mouse move or
    key press (browser autoplay policy).</div>

  <script src="classes.wasm-runtime.js"></script>
  <script>
    (function () {
      var status = document.getElementById("status");
      TeaVM.wasmGC.load("classes.wasm")
        .then(function (teavm) {
          status.textContent = "uNyan (WebAssembly) loaded.";
          teavm.exports.main([]);
          status.hidden = true;
        })
        .catch(function (error) {
          var detail = error && (error.message || "" + error);
          console.error(error);
          status.textContent = "Failed to start the WebAssembly module: " + detail;
        });
    })();
  </script>
</body>
</html>
