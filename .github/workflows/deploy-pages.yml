name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Grant the workflow the permissions Pages deployments need.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compiles the same web module used locally by web/run.ps1: the TeaVM
      # plugin writes classes.wasm (and its runtime loader) into
      # web/target/unyan-web.
      - name: Compile the wasm module
        run: mvn --batch-mode --no-transfer-progress -f web/pom.xml package

      # Same assembly rules as web/run.ps1: host page + wasm module + TeaVM
      # runtime + img/ + sfx/ + the generated asset-manifest.txt read by the
      # preloader. Demo screenshots are documentation, not engine assets.
      - name: Assemble the Pages site
        run: |
          SITE=web/target/unyan-web
          mkdir -p "$SITE/img" "$SITE/sfx"

          for file in img/*; do
            case "$file" in
              *-demo*|*-smoke*) ;;
              *) cp "$file" "$SITE/img/" ;;
            esac
          done
          for file in sfx/*; do
            cp "$file" "$SITE/sfx/"
          done

          {
            for file in img/*; do
              case "$file" in
                *-demo*|*-smoke*) ;;
                *) echo "img img/$(basename "$file")" ;;
              esac
            done
            for file in sfx/*; do
              echo "audio sfx/$(basename "$file")"
            done
          } > "$SITE/asset-manifest.txt"

          # GitHub Pages runs Jekyll unless told otherwise; skip it so every
          # file is served as-is.
          touch "$SITE/.nojekyll"

          # Debug extras are for local development only.
          rm -rf "$SITE/src" "$SITE/classes.wasm.map" "$SITE/classes.wasm.teadbg"

      # The repository's GITHUB_TOKEN has no administration permission, so
      # it cannot create the Pages site (the API answers "Resource not
      # accessible by integration"). Enable the site once in
      # GitHub -> Settings -> Pages -> Source: "GitHub Actions"; afterwards
      # this step only reads site metadata and never blocks the deploy.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/target/unyan-web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
